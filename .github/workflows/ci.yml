name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and index
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Build site and search index
        run: npm run build

      - name: Validate deploy config
        shell: bash
        run: |
          set -euo pipefail
          node -e "JSON.parse(require('fs').readFileSync('vercel.json','utf8')); console.log('OK vercel.json')"
          test -f public/_redirects
          echo "OK public/_redirects"
          test -f dist/_redirects
          echo "OK dist/_redirects"
          grep -q '/articles/page/1/' public/_redirects
          grep -q '/articles/page/1/' vercel.json
          echo "OK page/1 redirect present in both configs"

      - name: Verify required artifacts
        shell: bash
        run: |
          set -euo pipefail
          for f in \
            dist/index.html \
            dist/articles/index.html \
            dist/404.html \
            dist/pagefind/pagefind.js \
            dist/pagefind/pagefind-entry.json \
            dist/rss.xml \
            dist/robots.txt \
            dist/sitemap.xml; do
            if [ ! -f "$f" ]; then
              echo "::error::Missing required build artifact: $f"
              exit 1
            fi
            echo "OK $f"
          done

      - name: Report Pagefind coverage
        run: |
          node -e "const fs=require('fs');const e=JSON.parse(fs.readFileSync('dist/pagefind/pagefind-entry.json','utf8'));const langs=Object.keys(e.languages||{});if(!langs.includes('zh-cn')){console.error('::error::Pagefind index is missing zh-cn language');process.exit(1);}const n=langs.reduce((s,l)=>s+(e.languages[l].page_count||0),0);console.log('Pagefind zh-cn indexed pages:',n);if(n===0)console.log('::warning::Pagefind indexed 0 pages');"

      - name: Upload dist artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-dist-${{ github.run_id }}
          path: dist
          retention-days: 7
          if-no-files-found: error
